networks:
  spark-monitoring-lab:
    name: spark-monitoring-lab
    driver: bridge

services:


  spark-master:
    image: spark:3.5.6-python3
    container_name: spark-master
    hostname: spark-master
    user: root
    ports:
      - "8080:8080"   # Master UI
      - "7077:7077"   # Master RPC
    volumes:
      - ./spark/configs/:/opt/spark/conf
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /dev/null
      "
    networks:
      - spark-monitoring-lab


  spark-worker:
    image: spark:3.5.6-python3
    container_name: spark-worker
    hostname: spark-worker
    user: root
    depends_on:
      - spark-master
    ports:
      - "8082:8081"   # Worker UI
    volumes:
      - ./spark/configs/:/opt/spark/conf
    command: >
      bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077
      &&
      tail -f /dev/null
      "
    networks:
      - spark-monitoring-lab


  spark-job:
    image: spark:3.5.6-python3
    container_name: spark-job
    hostname: spark-job
    user: root
    depends_on:
      - spark-master
      - spark-worker
    ports:
      - "4040:4040"   # Driver Spark UI
    volumes:
      - ./spark/code:/src
      - ./spark/dependencies:/dependencies
      - ./spark/configs/:/opt/spark/conf
    command: >
      bash -c "
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --jars $$(echo /dependencies/*.jar | tr ' ' ',')
      /src/replicator.py
      "
    networks:
      - spark-monitoring-lab


  prometheus:
    user: root
    image: prom/prometheus:v3
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /var/data/infrastructure/prometheus-mon:/prometheus
    environment:
      - TZ=Asia/Tehran
    restart: unless-stopped
    networks:
      - spark-monitoring-lab

  grafana:
    user: root
    image: grafana/grafana:13.0-slim
    container_name: grafana
    hostname: grafana
    ports:
      - 3000:3000
    volumes:
      - /var/data/infrastructure/grafana-mon:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: grafana
      GF_SECURITY_ADMIN_PASSWORD: grafana
      TZ: Asia/Tehran
    networks:
      - spark-monitoring-lab

  kafka:
    image: apache/kafka:4.0.0-rc0
    container_name: kafka
    hostname: kafka
    restart: always
    user: root
    networks:
      - spark-monitoring-lab
    ports:
      - 9093:9093
      - 9092:9092
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DELETE_TOPIC_ENABLE: true
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CONTROLLER_QUORUM_RETRY_BACKOFF_MS: 60000
      KAFKA_CLUSTER_ID: 110
      KAFKA_NODE_ID: 11
      KAFKA_CONTROLLER_QUORUM_VOTERS: 11@kafka:9093
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    volumes:
      - ./kafka_volume:/var/lib/kafka/data
